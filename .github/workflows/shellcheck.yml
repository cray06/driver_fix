name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe bash
        run: bash -n fix.sh
      - name: ShellCheck
        run: shellcheck -S warning fix.sh
      - name: Simulation (--dry-run)
        run: sudo bash fix.sh --dry-run --yes --no-color
